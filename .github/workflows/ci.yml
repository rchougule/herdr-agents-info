name: CI

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch/PR cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # rust-toolchain.toml pins the exact channel (1.96.1, matching herdr's own
  # toolchain per PLAN §8.3); dtolnay/rust-toolchain reads it via
  # `toolchain-file`, no need to hardcode the version here.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain-file: rust-toolchain.toml
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain-file: rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain-file: rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --all-targets

  # Tag-triggered release build (PLAN §8.3 "Release builds on tag"). Builds
  # the binary for both platforms and uploads it as a workflow artifact; this
  # plugin is distributed via `herdr plugin install` building from source
  # (PLAN §8.4), so these artifacts are a convenience for manual distribution
  # / sanity-checking a tag, not an automatic GitHub Release publish step.
  release-build:
    name: release-build (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain-file: rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: agents-info-${{ matrix.os }}-${{ github.ref_name }}
          path: target/release/agents-info
          if-no-files-found: error
