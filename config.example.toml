# agents-info plugin config.
# Copy to $HERDR_PLUGIN_CONFIG_DIR/config.toml. Every field is optional and
# defaults to the values shown here, so an empty file behaves identically.

[tokens]
login = "off"        # off | always   ("auto" is reserved for a future release → treated as off)
model = true         # show the model token ($model)

[thresholds]
warn = 50            # pct >= warn  → ctx_warn (amber)
hot  = 80            # pct >= hot   → ctx_hot  (red)

[context_window]
default = 200000
auto_promote_1m = true   # if observed usage exceeds `default`, treat window as 1M

[context_window.by_model]
# Explicit per-model overrides always win over auto-promotion. Uncomment for a
# model you always run at 1M context:
# "claude-opus-4-8" = 1000000

[layout]
# Fixed field->slot layout budgets (`docs/DESIGN.md` Placement). herdr never tells the
# plugin the live sidebar width, so the packer assumes one and derives per-line
# budgets from it. If your sidebar is wider/narrower than the 26-column default,
# retune `assumed_width` here — no rebuild needed.
assumed_width = 26   # assumed sidebar width in columns
# The two usable budgets default to assumed_width - 2 (line 1) and
# assumed_width - 4 (lines 2+). Override them directly only if your terminal's
# indents differ from herdr's defaults:
# line1_usable = 24
# other_usable = 22
# Optional between-entry separator: a rule char/pattern tiled to the row width,
# drawn on the $sep line. Pair with row_gap = 0 so it replaces the blank gap.
# separator = "─"

[icons]
# Optional per-field icons on the metadata line (disk · model · context %), so a
# glance says what each value is. Any glyph the terminal renders — emoji, Nerd
# Font, or a plain symbol. Absent/empty = no icon for that field. They sit on
# their own line, so double-width emoji do not misalign anything.
# disk    = "💾"       # → "💾 9.6G"
# model   = "🧠"       # → "🧠 fable"
# context = "📊"       # → "📊 44%"

[disk]
# Per-pane disk footprint ($disk token, on the metadata line). Shown ONLY when a
# pane's footprint is at or above `warn_mb`, so it reads as an alert for sessions
# that have grown heavy — not as always-on clutter. Add `$disk` to your
# rows_by_agent.claude metadata line to render it.
enabled = true       # measure and report the $disk token
measure = "cwd"      # cwd | transcript | project_dir  (see below)
warn_mb = 500        # only show $disk when the footprint is >= this many MiB
refresh_secs = 1800  # re-measure a cwd at most this often (its walk is cached)
timeout_ms = 15000   # per-tree budget for a cwd walk; it bails rather than hang.
                     # Runs off the sweep's critical path, so this can be
                     # generous — a real 10–25 GB worktree takes ~8–10s to walk
                     # cold, and too small a budget caches it as "unmeasurable".
# measure options:
#   "cwd"         — the pane's working directory (the git worktree checkout),
#                   measured recursively. This is where the GB live
#                   (node_modules / target / build output). The default. The
#                   walk is done off the sweep's critical path (fast tokens are
#                   never delayed), cached for `refresh_secs`, run in parallel
#                   across distinct cwds, and bounded by `timeout_ms`.
#   "transcript"  — this session's own .jsonl only (one stat; subagent turns are
#                   recorded in it as sidechains, so they already count). Usually
#                   only MB, so it rarely trips warn_mb.
#   "project_dir" — sum of every .jsonl in this session's ~/.claude/projects/<dir>/.
#                   Captures sibling sessions started in the same cwd, but
#                   over-attributes that shared history to each pane sharing it.
